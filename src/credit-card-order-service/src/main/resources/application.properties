server.forward-headers-strategy=framework
server.port=8080

# --- Request thread pool & connection limits (scale hardening) ---
# Bounded, explicit Tomcat tuning so behaviour under load is predictable rather
# than relying on framework defaults. Values are overridable via env
# (SERVER_TOMCAT_THREADS_MAX, etc.) at deploy time.
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:200}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:20}
server.tomcat.accept-count=${SERVER_TOMCAT_ACCEPT_COUNT:200}
server.tomcat.max-connections=${SERVER_TOMCAT_MAX_CONNECTIONS:8192}
# Cap how long a request may occupy a worker thread; prevents a slow downstream
# from pinning a thread indefinitely (defence in depth alongside client timeouts).
server.tomcat.connection-timeout=${SERVER_TOMCAT_CONNECTION_TIMEOUT:20s}

build.version={{BUILD_VERSION}}
build.date={{BUILD_DATE}}
build.commit={{BUILD_COMMIT}}

logging.level.org.apache.catalina.core.ContainerBase=OFF